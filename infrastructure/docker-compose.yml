version: '3.7'
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "9090:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - keycloak-network

volumes:
  keycloak_data:
    driver: local
networks:
  keycloak-network:
    driver: bridge