name: ticket-service CI

on:
  push:
    branches: [master]
    paths:
      - 'ticket-service/**'
      - '.github/workflows/ticket-service-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'ticket-service/**'
      - '.github/workflows/ticket-service-ci.yml'

defaults:
  run:
    working-directory: ticket-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `test` pulls postgis/postgis:14-3.5 via Testcontainers for the @DataJpaTest
      # slice tests (AbstractPostgresContainerTest) -- GitHub-hosted ubuntu runners
      # have Docker running by default, so no extra service/setup is needed for that.
      - name: Build and test
        run: ./gradlew build --no-daemon
